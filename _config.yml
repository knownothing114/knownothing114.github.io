# So Simple 主题配置

theme: jekyll-theme-so-simple
locale: zh-CN
timezone: Asia/Shanghai

title: 康康的博客
description: >-
  记录自己总是忘记的技术,也会有对人生的所感所想
url: "https://knownothing114.github.io"
logo: /assets/img/favicons/web-app-manifest-512x512.png

# 外观
skin: "/assets/css/skins/default.css"
date_format: "%Y-%m-%d"
read_time: true
words_per_minute: 200

# 字体(现代简洁中文优先)
google_fonts:
  - name: "Noto Sans SC"
    weights: "400,500,700"
  - name: "Noto Serif SC"
    weights: "400,700"

# 作者(详细资料见 _data/authors.yml)
author: kangkang

# 链接
footer_links:
  - title: GitHub
    url: https://github.com/knownothing114
    icon: fab fa-github
  - title: RSS
    url: /atom.xml
    icon: fas fa-rss

copyright: >-
  &copy; 2026 kangkang. 除特别注明外,本站文章均采用
  <a href="https://creativecommons.org/licenses/by/4.0/deed.zh" rel="license">CC BY 4.0</a> 许可协议。

# 构建
permalink: /posts/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# 分页
paginate: 10
paginate_path: /page:num/

# 搜索
search_full_content: true

# 分类/标签归档页路径(文章页的分类/标签会链接到这些锚点)
category_archive_path: "/categories/#"
tag_archive_path: "/tags/#"

# 插件
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
  - jekyll-gist

feed:
  path: atom.xml

# 排除
exclude:
  - .github
  - .devcontainer
  - .vscode
  - .gitmodules
  - README.md
  - LICENSE
  - tools
